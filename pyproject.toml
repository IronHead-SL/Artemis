[project]
name = "artemis"
version = "0.1.0"
description = "Museum collection enrichment pipeline — Met API → MongoDB → Wikidata → Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.16.0",
    "neo4j>=5.0.0",
    "SPARQLWrapper>=2.0.0",
    "requests>=2.32.5",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.1",
    "torch>=2.11.0",
    "open-clip-torch>=3.3.0",
    "streamlit>=1.57.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikidata", "graph_ops"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
