services:

  neo4j:
    image: neo4j:5.18-community
    container_name: artemis-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo
    container_name: artemis_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  met_feeder:
    build:
      context: .
      dockerfile: ./metmuseum-feeder/Dockerfile
    container_name: artemis_met_feeder
    depends_on:
      - mongodb
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"

  wikidata_feeder:
    build:
      context: .
      dockerfile: ./wikidata-feeder/Dockerfile
    container_name: artemis-feeder
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:  
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"
      MONGO_DB: "artemis_db"
    restart: on-failure

volumes:
  neo4j_data:
  mongo_data: