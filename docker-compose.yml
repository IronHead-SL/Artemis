services:

  mongodb:
    image: mongo:latest
    container_name: artemis_mongo
    ports:
      - "27018:27017"
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: always

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/7474 && echo ok || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s

  met_feeder:
    build:
      context: .
      dockerfile: ./metmuseum-feeder/Dockerfile
    container_name: artemis_met_feeder
    depends_on:
      - mongodb
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"

  wikidata_feeder:
    build:
      context: .
      dockerfile: ./wikidata-feeder/Dockerfile
    container_name: artemis_wikidata_feeder
    depends_on:
      mongodb:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
    restart: on-failure

volumes:
  neo4j_data: