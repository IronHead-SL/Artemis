services:
  neo4j:
    image: neo4j:latest
    container_name: artemis-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "2G"
      NEO4J_dbms_memory_heap_max__size: "2G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo
    container_name: artemis_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: artemis_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  met_feeder:
    build:
      context: .
      dockerfile: ./metmuseum-feeder/Dockerfile
    container_name: artemis_met_feeder
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"
    restart: on-failure

  wikidata_feeder:
    build:
      context: .
      dockerfile: ./wikidata-feeder/Dockerfile
    container_name: artemis-feeder
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"
      MONGO_DB: "artemis_db"
    restart: on-failure

  ia-image-processor:
    build:
      context: .
      dockerfile: ./ia-image-processor/Dockerfile
    container_name: artemis_ia_processor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HF_TOKEN=${HF_TOKEN:-}
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: ./front/Dockerfile
    container_name: artemis_frontend
    ports:
      - "8501:8501"
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://admin:password@mongodb:27017/"
      MONGO_DB: "artemis_db"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "artworks"
    restart: always

volumes:
  neo4j_data:
  mongo_data:
  qdrant_data:
  model_cache: